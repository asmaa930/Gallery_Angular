<!-- ____________________________________ Gallery ____________________________________ -->


<div id="Gallery">
    <div class="container py-5">
        <div class="w-100 d-flex flex-column row-gap-3 row-gap-lg-5">
            <div class="content gap-3">

                <ng-container *ngFor="let product of products.slice(0,halfLengthProducts); index as i; first as f">
                    <div class="box {{(currentBox==box|| (!isProductHovered && f))?'active':'' }}" #box
                        (mouseenter)="updateBoxHovered(box)">
                        <div class="item">

                            <div class="image">
                                <img src="assets/images/{{product?.img}}" [attr.data-index]="i" #currentImg
                                    class="img-fluid" alt="{{product.title}}">
                            </div>
                            <div class="layout p-3">
                                <button class="btn open-key mb-4 rounded-circle"
                                    (click)="openPopup(popup,popupImg,currentImg)">
                                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                </button>
                                <div class="description p-3">
                                    <h3 class="label"> {{product.title}} </h3>
                                    <p class="mb-0"> {{product.description}} </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </ng-container>

            </div>

            <div class="content gap-3">

                <ng-container *ngFor="let product of products.slice(halfLengthProducts); index as i">
                    <div class="box {{currentBox==box?'active':''}}" #box (mouseenter)="updateBoxHovered(box)">
                        <div class="item">
                            <div class="image">
                                <img src="assets/images/{{product?.img}}" [attr.data-index]="i+halfLengthProducts"
                                    #currentImg class="img-fluid" alt="{{product.title}}">
                            </div>
                            <div class="layout p-3">
                                <button class="btn open-key mb-4 rounded-circle"
                                    (click)="openPopup(popup,popupImg,currentImg)">
                                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                </button>
                                <div class="description p-3">
                                    <h3 class="label"> {{product.title}} </h3>
                                    <p class="mb-0"> {{product.description}} </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </ng-container>

            </div>


        </div>
    </div>
</div>

<!-- ____________________________________ PopUp ____________________________________ -->


<div class="popup" #popup (click)="closePopup()">
    <div class="container">
        <div class="box" (click)="stopProp($event)">
            <div class="image">
                <img src="assets/images/1.jpg" #popupImg class="img-fluid">
            </div>

            <div class="icons">
                <i class="fa-solid fa-xmark close" (click)="closePopup()"></i>
                <i class="fa-solid fa-angles-left prev" (click)="targetImg('prev')"></i>
                <i class="fa-solid fa-angles-right next" (click)="targetImg('next')"></i>

                <div class="wrapper_indicators">
                    <ul class="indicators list-unstyled column-gap-2 column-gap-lg-3">
                        <ng-container *ngFor="let product of products;index as i">
                            <li class="{{currentImgIndex == i?'active':''}}" [attr.data-index]="i" (click)="paginateImg(i)">
                                {{i+1}} </li>
                        </ng-container>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
